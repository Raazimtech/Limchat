<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b7ef2a"><meta name="description" content="Limchat — private direct messaging."><link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><title>Limchat</title></head><body><div id="toast" class="toast" role="status"></div><section id="auth" class="auth-screen"><div class="auth-card"><div class="brand"><img src="favicon.svg" alt="Limchat logo"><span>limchat</span></div><p class="tagline">Private conversations. No noise.</p><div class="auth-tabs"><button class="tab active" data-auth="login">Log in</button><button class="tab" data-auth="signup">Create account</button></div><form id="auth-form"><label>Username<input id="username" autocomplete="username" minlength="3" maxlength="24" required placeholder="your_username"></label><label id="display-wrap" class="hidden">Display name<input id="display-name" maxlength="60" placeholder="Your name"></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="••••••••"></label><button class="primary wide" type="submit" id="auth-submit">Log in</button></form><p class="auth-note">Your unique username is how people find you. Passwords are handled by secure authentication.</p></div></section><section id="app" class="app hidden"><aside class="sidebar"><header class="sidebar-head"><div class="brand small"><img src="favicon.svg" alt=""><span>limchat</span></div><button id="logout" class="icon-btn" title="Log out" aria-label="Log out"><svg viewBox="0 0 24 24"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M15 16l4-4-4-4M19 12H9"/></svg></button></header><div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="user-search" placeholder="Find by username" autocomplete="off"></div><div id="search-results" class="search-results hidden"></div><div id="chat-list" class="chat-list"></div></aside><main class="main"><header class="topbar"><button id="mobile-back" class="icon-btn hidden" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="mobile-brand brand small"><img src="favicon.svg" alt=""><span>limchat</span></div><div id="mobile-title" class="mobile-title hidden"></div><button id="mobile-search" class="icon-btn" aria-label="Search people"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button></header><div id="view" class="view"></div><nav class="bottom-nav" aria-label="Main navigation"><button class="nav-item active" data-view="chats"><svg viewBox="0 0 24 24"><path d="M4 6.5A3.5 3.5 0 0 1 7.5 3h9A3.5 3.5 0 0 1 20 6.5v6a3.5 3.5 0 0 1-3.5 3.5H10l-5 4v-7A3.5 3.5 0 0 1 4 10.5z"/></svg><small>Chats</small></button><button class="nav-item" data-view="files"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg><small>Files</small></button><button class="nav-item compose" id="new-chat"><span><svg viewBox="0 0 24 24"><path d="M5 5l14 7-14 7 3-7z"/><path d="M8 12h10"/></svg></span><small>Send</small></button><button class="nav-item" data-view="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 20c.5-4 2.4-6 5.5-6s5 2 5.5 6M16 6a3 3 0 0 1 0 5.5M16 14c2.4.4 4 2.2 4.5 6"/></svg><small>People</small></button><button class="nav-item" data-view="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.6-4.5 2.9-7 7-7s6.4 2.5 7 7"/></svg><small>Profile</small></button></nav></main></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="limchat-cache.js"></script><script src="app.js"></script><script src="file-sharing.js"></script><script src="site-enhancements.js"></script></body></html>
